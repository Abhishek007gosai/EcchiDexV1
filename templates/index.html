<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1e6" />
  <title>{{ brand_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-brand="{{ brand_name }}">

  <!-- ===================== Home view ===================== -->
  <main id="app-view">
    <div class="scroll-area" id="scroll-area">

      <div class="identity-row">
        <div class="identity-left">
          <span class="status-dot"></span>
          <div class="brand-block">
            <span class="brand-handle">{{ brand_handle }}</span>
          </div>
        </div>
        <button class="icon-btn" id="profile-btn" aria-label="Profile">&#128100;</button>
      </div>

      <div class="search-row" id="search-row-home">
        <span class="search-icon-left">&#128269;</span>
        <input id="search-input" class="search-input" type="text" placeholder="Search anime..." autocomplete="off" readonly />
      </div>

      <div class="pill-tabs">
        <button class="pill-tab active" data-tab="all">All</button>
        <button class="pill-tab" data-tab="library">Available</button>
      </div>

      <!-- "All" tab: Trending + Top Airing -->
      <div id="tab-all">
        <section>
          <div class="section-header-row">
            <h2 class="section-header"><span class="accent-bar"></span>Trending Now</h2>
          </div>
          <div id="trending-row" class="hscroll"></div>
        </section>

        <section>
          <div class="section-header-row">
            <h2 class="section-header"><span class="accent-bar"></span>Top Airing</h2>
          </div>
          <div id="top-airing-list" class="popular-grid"></div>
          <p id="popular-load-more" class="search-loading-more hidden">Loading more…</p>
        </section>
      </div>

      <!-- "Available" tab: your posted library, browsable A–Z -->
      <div id="tab-library" class="hidden">
        <div id="ad-slot" class="hidden"></div>
        <h2 class="section-header"><span class="accent-bar"></span>Available Anime</h2>
        <div id="letter-bar" class="letter-bar"></div>
        <div id="available-groups"></div>
        <p id="available-empty" class="empty-note hidden">No anime found.</p>
      </div>

    </div>
  </main>

  <!-- ===================== Search view ===================== -->
  <section id="search-view" class="hidden">
    <div class="subview-topbar">
      <button class="back-btn" data-back="home">&#8249; back</button>
      <span class="subview-title">Search</span>
    </div>
    <div class="search-row">
      <span class="search-icon-left">&#128269;</span>
      <input id="search-view-input" class="search-input" type="text" placeholder="Search anime..." autocomplete="off" />
    </div>

    <div id="search-results" class="hidden">
      <div id="search-results-groups"></div>
      <p id="search-results-empty" class="empty-note hidden">No anime found.</p>
    </div>

    <div id="search-landing">
      <div class="section-header-row">
        <h2 class="section-header"><span class="accent-bar"></span>Popular Searches</h2>
        <button id="popular-search-clear" class="text-link hidden">Clear All</button>
      </div>
      <div id="popular-search-list"></div>

      <h2 class="section-header"><span class="accent-bar"></span>Genres</h2>
      <div id="genre-tile-grid" class="genre-tile-grid"></div>
    </div>
  </section>

  <!-- ===================== Genre browse view ===================== -->
  <section id="genre-view" class="hidden">
    <div class="subview-topbar">
      <button class="back-btn" data-back="search">&#8249; back</button>
      <span class="subview-title" id="genre-view-title">Genre</span>
    </div>
    <div id="genre-browse-grid" class="grid-2"></div>
  </section>

  <!-- ===================== Profile view ===================== -->
  <section id="profile-view" class="hidden">
    <div class="subview-topbar">
      <button class="back-btn" data-back="home">&#8249; back</button>
      <span class="subview-title">Profile</span>
    </div>
    <div class="profile-card" id="profile-card">
      <p class="profile-hint">Loading profile…</p>
    </div>
  </section>

  <!-- ===================== Persistent bottom nav (shown across all views) ===================== -->
  <nav class="tab-bar">
    <button class="nav-btn active" data-nav="home">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/></svg>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-btn" data-nav="search">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="nav-label">Search</span>
    </button>
    <button class="nav-btn" data-nav="profile">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.9 3.6-7 8-7s8 3.1 8 7"/></svg>
      <span class="nav-label">Profile</span>
    </button>
  </nav>

  <!-- ===================== Detail bottom sheet (compact centered modal) ===================== -->
  <div id="detail-overlay" class="overlay hidden">
    <div class="sheet" id="detail-sheet">
      <div class="sheet-media">
        <img id="detail-poster" src="" alt="" />
        <button id="detail-close" class="close-btn">&#10005;</button>
      </div>
      <div class="sheet-body">
        <div class="detail-header-row">
          <img id="detail-thumb" class="detail-thumb hidden" src="" alt="" />
          <div class="detail-header-text">
            <h3 id="detail-title" class="sheet-title"></h3>
            <p id="detail-subtitle" class="detail-subtitle hidden"></p>
          </div>
        </div>

        <div id="detail-meta-pills" class="meta-pill-row"></div>
        <div id="detail-genres" class="genre-row"></div>

        <p class="synopsis-label">Synopsis</p>
        <p id="detail-description" class="sheet-description"></p>
        <button id="detail-readmore" class="read-more-link hidden">Read More</button>

        <div id="detail-action-area"></div>

        <button id="report-open-btn" class="report-text-link">&#128681; Report</button>
      </div>
    </div>
  </div>

  <!-- ===================== Set Join Link sheet (admin only) ===================== -->
  <div id="link-overlay" class="overlay hidden">
    <div class="sheet">
      <div class="sheet-body">
        <h3 class="sheet-title">Set Join Link</h3>
        <input id="link-input" class="edit-link-input link-input-full" type="text"
               placeholder="Channel ID, @username, or URL" autocomplete="off" />
        <div class="btn-row">
          <button id="link-cancel" class="btn btn-secondary">Cancel</button>
          <button id="link-save" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== Report sheet ===================== -->
  <div id="report-overlay" class="overlay hidden">
    <div class="sheet">
      <div class="sheet-body">
        <h3 class="sheet-title">Report an issue</h3>
        <div id="report-reasons" class="reason-list">
          <button class="reason-btn" data-reason="Link isn't working">Link isn't working</button>
          <button class="reason-btn" data-reason="Wrong anime uploaded">Wrong anime uploaded</button>
          <button class="reason-btn" data-reason="Episodes are missing">Episodes are missing</button>
          <button class="reason-btn" data-reason="Poor video quality">Poor video quality</button>
          <button class="reason-btn" data-reason="Wrong channel linked">Wrong channel linked</button>
          <button class="reason-btn" data-reason="Other">Other</button>
        </div>
        <textarea id="report-details" class="report-textarea" maxlength="50" placeholder="Optional details (max 50 char)"></textarea>
        <div class="btn-row">
          <button id="report-cancel" class="btn btn-secondary">Cancel</button>
          <button id="report-submit" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
